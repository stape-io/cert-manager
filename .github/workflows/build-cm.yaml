name: Build and Push cert-manager Image

on:
  push:
    branches: [ "release-1.15.06" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # 1) Check out the repository
      - uses: actions/checkout@v3

      # 2) Authenticate to Google Cloud using Workload Identity Federation
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/664050025753/locations/global/workloadIdentityPools/github/providers/stape-io
          service_account: github-actions@stape-development.iam.gserviceaccount.com
          token_format: access_token

      # 3) Install Docker and Make
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io make

      # 4) Build all of the cert-manager container images (for all architectures)
      - name: Build cert-manager container images
        run: make all-containers

      # 5 & 6) Load, tag, and push one of the images (controller + amd64) to Artifact Registry
      #
      # If you want to push more than just the controller or more architectures,
      # duplicate or loop over each binary + architecture as needed.
      - name: Load, tag, and push controller image (amd64)
        env:
          # Example override of VERSION if desired; 
          # otherwise it comes from git describe in the Makefile
          VERSION: "latest"
        run: |
          # Load the tarball that was produced in _bin/containers
          docker load -i _bin/containers/cert-manager-controller-linux-amd64.tar.gz

          # The Makefile tags the loaded image as:
          #     cert-manager-controller-amd64:<VERSION>
          # but you can confirm the exact tag via `docker images`.
          #
          # Retag it as the "latest" version for your Artifact Registry repo.
          docker tag cert-manager-controller-amd64:${VERSION} \
            europe-west1-docker.pkg.dev/stape-development/services/cert-manager:latest

          # Push it to Artifact Registry
          docker push europe-west1-docker.pkg.dev/stape-development/services/cert-manager:latest
